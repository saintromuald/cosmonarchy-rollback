# cosmo-farm shared defaults. Machine-specific values (FARM_SLOTS) live in
# $FARMDIR/farm.local.conf, written by machine-setup.sh.

FARMDIR="${FARMDIR:-$HOME/Games/cosmo-farm}"
FARM_BUILD="${FARM_BUILD:-Release}"

# How many pair workers run in parallel on this machine (auto-sized by
# machine-setup.sh; override in farm.local.conf).
FARM_SLOTS="${FARM_SLOTS:-1}"

# Run parameters
FARM_HASH_EVERY="${FARM_HASH_EVERY:-4}"       # frames between desync-hash reports
FARM_WALL_LIMIT="${FARM_WALL_LIMIT:-240}"     # wall seconds per pair run
FARM_BOOT="${FARM_BOOT:-110}"                 # seconds before driving the menu
FARM_STREAM_FRAMES="${FARM_STREAM_FRAMES:-60000}"  # turns per generated stream
FARM_STREAM_DENSITY="${FARM_STREAM_DENSITY:-600}"  # 1 command turn per N frames

# Daily active window (24h clock, local time): farmd exits outside it and the
# systemd timer restarts it inside. "always" disables the window.
FARM_WINDOW="${FARM_WINDOW:-22:30-08:30}"

# Map pinned in the menu path (registry pinning; must exist in the trees).
FARM_MAP="${FARM_MAP:-C:\Cosmonarchy\Starcraft\maps\CMBW-Root\CMBW-maps\melee\1v1\Class 0 - Testing Grounds\1. Standard-Bearers\(2)Pagan Imperium 1.0.scx}"
# OCR label of the map row in the browser's left list (fuzzy-matched).
FARM_MAP_LABEL="${FARM_MAP_LABEL:-pagan}"
